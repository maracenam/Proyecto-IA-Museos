[project]
name = "observatorio-surdoc"
version = "0.0.1"
description = "Observatorio de Colecciones Arqueológicas SURDOC: pipeline de extracción, normalización con IA y consulta."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
app = [
    "pandas>=2.2",
    "plotly>=5.24",
    "streamlit>=1.40",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false
# La app (Streamlit) se instala también en desarrollo y CI para poder probarla.
default-groups = ["dev", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Los módulos de app/ se importan por nombre (Streamlit agrega app/ al path).
known-first-party = ["pipeline", "tests", "comun", "datos", "logica"]
